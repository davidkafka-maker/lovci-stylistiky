<!-- LOVCI STYLISTIKY: MINIMALNI MOBILNI VERZE 25S + ANIMACE -->
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lovci stylistiky</title>
<style>
  :root {
    --bg1:#fff7d6; --bg2:#e0f2fe; --ink:#172033; --muted:#64748b;
    --blue:#2563eb; --red:#dc2626; --green:#16a34a; --gold:#f59e0b;
    --card:#ffffff; --line:#e2e8f0; --violet:#7c3aed;
  }
  * { box-sizing:border-box; }
  html, body { min-height:100%; }
  body {
    margin:0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 10% 10%, rgba(245,158,11,.32), transparent 26%),
      radial-gradient(circle at 90% 8%, rgba(37,99,235,.22), transparent 28%),
      linear-gradient(135deg, var(--bg1), var(--bg2));
  }
  .app { width:min(920px,100%); margin:0 auto; padding:12px; }
  .screen { display:none; }
  .screen.active { display:block; }

  .startCard, .resultCard {
    margin: min(8vh,70px) auto 0;
    max-width:560px;
    background:rgba(255,255,255,.92);
    border:2px solid rgba(255,255,255,.9);
    border-radius:26px;
    box-shadow:0 20px 60px rgba(15,23,42,.18);
    padding:24px;
    text-align:center;
  }
  h1 { margin:0 0 8px; font-size:clamp(30px, 6vw, 52px); line-height:1; }
  .sub { color:var(--muted); font-weight:800; margin-bottom:18px; }
  .fields { display:grid; gap:10px; margin-top:16px; }
  input {
    width:100%; padding:14px 16px; border-radius:16px; border:2px solid #cbd5e1;
    font-size:18px; font-weight:750; background:#fff;
  }
  .btn {
    border:0; border-radius:18px; padding:15px 20px; font-size:20px; font-weight:1000;
    color:white; background:linear-gradient(135deg,#2563eb,#7c3aed); cursor:pointer;
    box-shadow:0 10px 25px rgba(37,99,235,.25); width:100%;
    text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
  }
  .btn.secondary { background:linear-gradient(135deg,#0284c7,#0ea5e9); font-size:18px; padding:13px 18px; }
  .btnRow { display:grid; grid-template-columns:1fr; gap:10px; }
  .small { font-size:14px; color:var(--muted); line-height:1.35; }
  .warn { color:#991b1b; font-weight:900; margin-top:10px; }

  /* TEST: only one compact top bar */
  .topbar {
    position:sticky; top:0; z-index:10;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;
    padding:8px 6px 10px;
    backdrop-filter: blur(10px);
  }
  .qcount {
    justify-self:start; font-weight:1000; font-size:clamp(17px,4vw,24px);
    background:#fff; border:2px solid var(--line); border-radius:999px; padding:8px 12px;
    box-shadow:0 8px 22px rgba(15,23,42,.10);
  }
  .timerCircle {
    width:72px; height:72px; border-radius:50%; display:grid; place-items:center;
    font-size:30px; font-weight:1100; color:#111827;
    background:radial-gradient(circle at 32% 24%, #fff, #fde68a 50%, #f59e0b 100%);
    border:4px solid #fff; box-shadow:0 10px 25px rgba(245,158,11,.34);
    line-height:1;
  }
  .timerCircle.low { color:#fff; background:radial-gradient(circle at 32% 24%, #fecaca, #ef4444 55%, #991b1b 100%); animation:pulse .45s infinite alternate; }
  @keyframes pulse { from { transform:scale(1); } to { transform:scale(1.06); } }
  .scorePanel { justify-self:end; display:grid; gap:6px; align-items:center; }
  .scoreBox {
    min-width:58px; padding:6px 10px; border-radius:14px; color:#fff;
    font-size:clamp(19px,4.8vw,27px); font-weight:1100; line-height:1;
    display:flex; align-items:center; justify-content:center; gap:6px;
    box-shadow:0 8px 20px rgba(15,23,42,.18); border:2px solid rgba(255,255,255,.8);
    transition:transform .18s ease, filter .18s ease;
  }
  .scoreBox.ok { background:linear-gradient(135deg,#1d4ed8,#38bdf8); }
  .scoreBox.bad { background:linear-gradient(135deg,#b91c1c,#fb7185); }
  .scoreBox.bump { animation:scoreBump .34s ease; }
  .scoreLabel { font-size:.78em; opacity:.95; }
  @keyframes scoreBump { 0%{transform:scale(1)} 45%{transform:scale(1.14)} 100%{transform:scale(1)} }

  .tinyTitle { text-align:center; font-weight:1000; color:#334155; font-size:13px; letter-spacing:.06em; text-transform:uppercase; margin:-4px 0 6px; }
  .testCard {
    background:rgba(255,255,255,.96); border:2px solid rgba(255,255,255,.95);
    border-radius:24px; box-shadow:0 18px 50px rgba(15,23,42,.16);
    padding:clamp(14px,3vw,24px); min-height:calc(100dvh - 116px);
    display:flex; flex-direction:column; gap:10px;
  }
  .sample {
    font-size:clamp(22px,5.6vw,34px); line-height:1.28; font-weight:950;
    padding:14px; border-radius:20px;
    background:linear-gradient(135deg,#fef3c7,#dbeafe); border:2px solid #fff;
  }
  .question {
    font-size:clamp(17px,4.2vw,24px); line-height:1.25; font-weight:850; color:#334155;
    padding:4px 2px 0;
  }
  .options { display:grid; gap:9px; margin-top:2px; }
  .opt {
    width:100%; border:2px solid #cbd5e1; background:#fff; color:#172033; text-align:left;
    border-radius:18px; padding:13px 14px; font-size:clamp(17px,4.4vw,23px); line-height:1.2;
    font-weight:850; cursor:pointer; box-shadow:0 7px 18px rgba(15,23,42,.08);
    transition:transform .16s ease, background-color .22s ease, border-color .22s ease, color .22s ease, box-shadow .22s ease;
  }
  .opt:not(:disabled):active { transform:scale(.985); }
  .opt:disabled { cursor:default; opacity:1; }
  .opt.selected { border-color:#7c3aed; background:#ede9fe; color:#3b0764; animation:selectPulse .24s ease; }
  .opt.correct { border-color:#16a34a; background:#bbf7d0; color:#14532d; box-shadow:0 0 0 4px rgba(22,163,74,.18), 0 10px 24px rgba(22,163,74,.18); animation:goodPop .45s ease; }
  .opt.wrong { border-color:#dc2626; background:#fecaca; color:#7f1d1d; box-shadow:0 0 0 4px rgba(220,38,38,.16), 0 10px 24px rgba(220,38,38,.16); animation:badShake .38s ease; }
  .opt.reveal { animation:revealCorrect .62s ease; }
  @keyframes selectPulse { 0%{transform:scale(1)} 50%{transform:scale(1.025)} 100%{transform:scale(1)} }
  @keyframes goodPop { 0%{transform:scale(1)} 45%{transform:scale(1.035)} 100%{transform:scale(1)} }
  @keyframes badShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 50%{transform:translateX(4px)} 75%{transform:translateX(-2px)} }
  @keyframes revealCorrect { 0%{transform:scale(1); filter:brightness(1)} 45%{transform:scale(1.045); filter:brightness(1.08)} 100%{transform:scale(1); filter:brightness(1)} }
  .feedback { min-height:30px; font-size:20px; font-weight:1100; text-align:center; }
  .feedback.good { color:#16a34a; animation:feedbackPop .35s ease; }
  .feedback.bad { color:#dc2626; animation:feedbackPop .35s ease; }
  @keyframes feedbackPop { 0%{transform:scale(.96); opacity:.4} 100%{transform:scale(1); opacity:1} }

  .mark { font-size:92px; line-height:1; font-weight:1100; color:var(--violet); margin:10px 0; }
  .scoreText { font-size:24px; font-weight:1000; }
  .status { margin-top:10px; font-weight:800; color:#475569; }

  @media (max-width:430px) {
    .app { padding:8px; }
    .timerCircle { width:62px; height:62px; font-size:27px; }
    .qcount { padding:7px 10px; }
    .scorePanel { gap:4px; }
    .scoreBox { min-width:46px; padding:5px 7px; border-radius:12px; }
    .testCard { border-radius:20px; padding:10px; gap:8px; min-height:calc(100dvh - 98px); }
    .sample { padding:11px; border-radius:17px; }
    .opt { padding:11px 12px; border-radius:16px; }
    .feedback { min-height:24px; font-size:18px; }
  }
  @media (max-height:680px) {
    .timerCircle { width:58px; height:58px; font-size:25px; }
    .sample { font-size:clamp(19px,4.8vw,29px); padding:10px; }
    .question { font-size:clamp(16px,3.8vw,21px); }
    .opt { font-size:clamp(16px,3.9vw,20px); padding:10px 12px; }
    .tinyTitle { display:none; }
  }
</style>
</head>
<body>
<div class="app">
  <section id="start" class="screen active">
    <div class="startCard">
      <h1>Lovci stylistiky</h1>
      <div class="sub">TEST · 15 otázek · 25 sekund na otázku</div>
      <p class="small">Vybere se vždy 3 otázky z každého oddílu. Otázky i odpovědi se promíchají. Během testu nepřepínejte kartu ani okno.</p>
      <div class="fields">
        <input id="jmeno" autocomplete="name" placeholder="Jméno a příjmení">
        <input id="trida" autocomplete="off" placeholder="Třída">
        <div class="btnRow">
          <button class="btn" onclick="startTest()">Spustit test</button>
          <a class="btn secondary" href="https://docs.google.com/spreadsheets/d/1HdxgVClm_32F6eXqHLjYHvl9A6sxIZyjHCYuWPfbT2s/edit?usp=sharing" target="_blank" rel="noopener">Výsledková tabulka</a>
        </div>
      </div>
      <div id="startWarn" class="warn" style="display:none"></div>
    </div>
  </section>

  <section id="test" class="screen">
    <div class="topbar">
      <div id="counter" class="qcount">1/15</div>
      <div id="timer" class="timerCircle">25</div>
      <div class="scorePanel" aria-label="Průběžné skóre"><div class="scoreBox ok"><span class="scoreLabel">✓</span><span id="correctLive">0</span></div><div class="scoreBox bad"><span class="scoreLabel">✕</span><span id="wrongLive">0</span></div></div>
    </div>
    <div class="tinyTitle">Lovci stylistiky</div>
    <div class="testCard">
      <div id="sample" class="sample"></div>
      <div id="question" class="question"></div>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback"></div>
    </div>
  </section>

  <section id="result" class="screen">
    <div class="resultCard">
      <h1 id="resultTitle">Výsledek</h1>
      <div id="mark" class="mark">1</div>
      <div id="points" class="scoreText"></div>
      <div id="sendStatus" class="status">Odesílám výsledek...</div>
      <button class="btn" style="margin-top:18px" onclick="location.reload()">Nový test</button>
    </div>
  </section>
</div>

let testQuestions = [], current = 0, correctCount = 0, wrongCount = 0, locked = false, testActive = false, finished = false, answersLog = [];
const TIME_PER_QUESTION = 25;
let timeLeft = TIME_PER_QUESTION, timerInterval = null, nextQuestionTimeout = null;
function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function prepareQuestion(q) { const options=q.moznosti.map((txt,idx)=>({txt, correct:idx===q.spravne})); return {...q, shuffledOptions:shuffle(options)}; }
function startTest() {
  const jmeno=document.getElementById('jmeno').value.trim(), trida=document.getElementById('trida').value.trim(), warn=document.getElementById('startWarn');
  if(!jmeno||!trida){ warn.style.display='block'; warn.textContent='Vyplň prosím jméno i třídu.'; return; }
  warn.style.display='none';
  const oddily=[...new Set(STYLISTIKA_DB.map(q=>q.oddil))];
  testQuestions=shuffle(oddily.flatMap(oddil=>shuffle(STYLISTIKA_DB.filter(q=>q.oddil===oddil)).slice(0,3))).map(prepareQuestion);
  current=0; correctCount=0; wrongCount=0; locked=false; finished=false; answersLog=[];
  stopTimer(); if(nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
  testActive=true; cheatArmed=false;
  showScreen('test'); renderQuestion(); setTimeout(()=>cheatArmed=true, 900);
}
function stopTimer() { if(timerInterval) clearInterval(timerInterval); timerInterval=null; }
function updateTimerDisplay() {
  const el=document.getElementById('timer'); if(!el) return;
  el.textContent=timeLeft; el.classList.toggle('low', timeLeft<=5);
}
function startQuestionTimer() {
  stopTimer(); timeLeft=TIME_PER_QUESTION; updateTimerDisplay();
  timerInterval=setInterval(()=>{ timeLeft--; updateTimerDisplay(); if(timeLeft<=0) handleTimeout(); },1000);
}
function handleTimeout() {
  if(locked||finished) return; stopTimer(); locked=true; wrongCount++;
  const q=testQuestions[current], all=document.querySelectorAll('.opt');
  all.forEach((b,i)=>{ b.disabled=true; if(q.shuffledOptions[i].correct) b.classList.add('correct','reveal'); });
  updateScore('bad'); playBad(); setFeedback('Čas vypršel.', 'bad');
  answersLog.push({id:q.id, oddil:q.oddil, spravne:false, zvoleno:'čas vypršel', spravna_odpoved:q.moznosti[q.spravne]});
  nextQuestionTimeout=setTimeout(()=>{ current++; current>=15 ? finishTest(false) : renderQuestion(); },2000);
}
function renderQuestion() {
  locked=false; const q=testQuestions[current];
  document.getElementById('counter').textContent=`${current+1}/15`;
  updateScore();
  document.getElementById('sample').textContent=q.text;
  document.getElementById('question').textContent=q.otazka;
  const feedback=document.getElementById('feedback'); feedback.textContent=''; feedback.className='feedback';
  const box=document.getElementById('options'); box.innerHTML='';
  q.shuffledOptions.forEach((opt,idx)=>{ const btn=document.createElement('button'); btn.className='opt'; btn.textContent=`${String.fromCharCode(65+idx)}) ${opt.txt}`; btn.onclick=()=>chooseAnswer(btn,opt,q); box.appendChild(btn); });
  startQuestionTimer();
}
function bumpScoreBox(kind) {
  const box=document.querySelector(`.scoreBox.${kind}`);
  if(!box) return;
  box.classList.remove('bump');
  void box.offsetWidth;
  box.classList.add('bump');
}
function updateScore(kind) {
  document.getElementById('correctLive').textContent=correctCount;
  document.getElementById('wrongLive').textContent=wrongCount;
  if(kind) bumpScoreBox(kind);
}
function chooseAnswer(btn,opt,q) {
  if(locked) return;
  stopTimer();
  if(nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
  locked=true;
  const all=document.querySelectorAll('.opt');
  all.forEach(b=>b.disabled=true);
  btn.classList.add('selected');

  setTimeout(()=>{
    if(opt.correct){
      correctCount++;
      btn.classList.remove('selected');
      btn.classList.add('correct');
      playGood();
      setFeedback('Správně!', 'good');
      updateScore('ok');
    } else {
      wrongCount++;
      btn.classList.remove('selected');
      btn.classList.add('wrong');
      all.forEach((b,i)=>{
        if(q.shuffledOptions[i].correct) b.classList.add('correct','reveal');
      });
      playBad();
      setFeedback('Chyba – správná odpověď je zvýrazněná.', 'bad');
      updateScore('bad');
    }
    answersLog.push({id:q.id, oddil:q.oddil, spravne:opt.correct, zvoleno:opt.txt, spravna_odpoved:q.moznosti[q.spravne]});
    nextQuestionTimeout=setTimeout(()=>{ current++; current>=15 ? finishTest(false) : renderQuestion(); }, opt.correct ? 1150 : 2000);
  },180);
}
function setFeedback(text,type) { const f=document.getElementById('feedback'); f.textContent=text; f.className='feedback '+type; }
function getMark(points) { if(points>=14) return 1; if(points>=12) return 2; if(points>=10) return 3; if(points>=8) return 4; return 5; }
function finishTest(cheat) {
  if(finished) return; stopTimer(); if(nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
  finished=true; testActive=false; const mark=cheat?6:getMark(correctCount);
  showScreen('result'); document.getElementById('mark').textContent=mark;
  document.getElementById('points').textContent=cheat?'Test ukončen: PODVOD / PŘEKLIKNUTÍ – známka 6':`${correctCount} / 15 bodů`;
  if(cheat){ document.getElementById('resultTitle').textContent='Test byl ukončen'; playCheat(); }
  sendResult(mark,cheat);
}
async function sendResult(mark, cheat) {
  const status = document.getElementById('sendStatus');

  const payload = {
    jmeno: document.getElementById('jmeno').value.trim(),
    trida: document.getElementById('trida').value.trim(),
    znamka: String(mark),
    rezim: 'TEST',
    oddil: 'Stylistika',
    body: String(cheat ? 0 : correctCount),
    celkem: '15',
    spravne: String(cheat ? 0 : correctCount),
    spatne: String(cheat ? 15 : 15 - correctCount),
    poznamka: cheat ? 'PODVOD' : 'Dokonceno',
    odeslano: 'ano'
  };

  // Přesně stejný princip jako funkční Lovci slovesných vzorů:
  // HTML odešle klasický POST formulář a Apps Script čte e.parameter.
  try {
    const iframeName = 'sendFrame_' + Date.now();
    const iframe = document.createElement('iframe');
    iframe.name = iframeName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = WEB_APP_URL;
    form.target = iframeName;
    form.style.display = 'none';

    Object.keys(payload).forEach(key => {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = key;
      input.value = payload[key];
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();
    status.textContent = 'Výsledek byl odeslán do tabulky.';

    setTimeout(() => {
      try { form.remove(); iframe.remove(); } catch(e) {}
    }, 6000);
  } catch (e) {
    status.textContent = 'Výsledek se nepodařilo odeslat.';
  }
}
function playTone(freqStart, freqEnd, type, duration, volume) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freqStart, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + Math.max(duration * 0.75, 0.05));

    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(volume || 0.22, ctx.currentTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration + 0.03);
  } catch(e) {}
}

function playGood() {
  // Příjemné dvojité stoupající cinknutí
  playTone(740, 980, 'sine', 0.13, 0.22);
  setTimeout(() => playTone(980, 1320, 'sine', 0.17, 0.24), 95);
}

function playBad() {
  // Jasný krátký hlubší tón pro chybnou odpověď
  playTone(260, 150, 'triangle', 0.28, 0.28);
}

function playCheat() {
  // Výrazný odlišný alarm pro překliknutí / podvod
  playTone(190, 90, 'sawtooth', 0.42, 0.46);
  setTimeout(() => playTone(420, 120, 'square', 0.50, 0.42), 260);
  setTimeout(() => playTone(120, 75, 'sawtooth', 0.55, 0.46), 620);
  if (navigator.vibrate) {
    try { navigator.vibrate([220, 90, 220, 90, 320]); } catch(e) {}
  }
}
let cheatArmed=false;
window.addEventListener('blur',()=>{ if(testActive&&cheatArmed&&!finished) finishTest(true); });
document.addEventListener('visibilitychange',()=>{ if(testActive&&cheatArmed&&document.hidden&&!finished) finishTest(true); });
